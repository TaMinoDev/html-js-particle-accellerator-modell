<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Particle Accellerator</title>
    <style>
        body { height: 100vh; width: 100vw; font-family: arial; color: balck; background-color: white; overflow: hidden; margin: 0; padding: 0px; }
        canvas { border: 1px solid black; width: 100px; height: 100px; image-rendering: crisp-edges; }
        .controll-room {
            position: fixed;
            top: 0px;
            left: 0px;
            border: 1px solid black;
            background-color: whitesmoke;
            padding: 5px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="controll-room">
        <div class="input-area">
            <input id="forceXinput" type="number" placeholder="Force for X"><input id="forceYinput" type="number" placeholder="Force for Y">
            <br>
            <button onclick="applyForce()">Apply Forces</button>
            <br>
            <input id="velocityXinput" type="number" placeholder="Set Velocity for X"><input id="velocityYinput" type="number" placeholder="Set Velocity for Y">
            <br>
            <button onclick="applyVelocity()">Apply Velocity</button>
            <br>
            <label>Show Trail? </label><input type="checkbox" id="trailInput" checked>
            <br>
            <label>Mode</label><select id="modeSelector"><option value="animation">requestAnimationFrame</option><option value="timeout">setTimeout</option></select><input id="bufferInput" type="number" placeholder="timebuffer in ms" value="50">
            <button onclick="applyMode()">Apply Mode Stettings</button>
            <br>
            <input id="xInput" type="number" placeholder="x coords"><input id="yInput" type="number" placeholder="y coords"><button onclick="applyCords()">Appley Coords</button><button onclick="loadCords()">Load Cords</button>
        </div>
        <div class="output-area">
            <br>
            <span id="velocityOutput"></span>
            <br>
            <span id="accellerationOutput"></span>
        </div>
    </div>
    <script>
        const canvas = document.getElementById('canvas');
        /** @type CanvasRenderingContext2D */
        const ctx = canvas.getContext('2d');

        canvas.style.height = window.innerHeight + 'px';
        canvas.style.width = window.innerWidth + 'px';
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;

        const cx = canvas.width/2;
        const cy = canvas.height/2;

        let pos = [];
        let vx = 0; // velocity X
        let vy = 0; // velocity Y
        let ax = 0; // accelleration X
        let ay = 0; // accelleration Y
        let m = 1; // mass
        let dt = 0.016 // Delta-Time (Time since the last Frame, with 60FPS 0.016)
        let contin = true;
        let limit = 10000000;
        let trail = [];
        let mode = 'animation';
        let buffer = 50;
        let showTrail = true;

        document.addEventListener('keydown', function (e) {
            if(e.key === ' ') {
                contin = contin === true ? false : true;
                tick();
            }
        });

        document.getElementById('trailInput').addEventListener('input', function (e) {
            showTrail = document.getElementById('trailInput').checked;
            console.log([showTrail,document.getElementById('trailInput').checked]);
        })

        function applyCords() {
            let x = 0;
            let y = 0;

            if(document.getElementById('xInput').value !== '') {
                x = Number(document.getElementById('xInput').value);
            }
            if(document.getElementById('xInput').value !== '') {
                y = Number(document.getElementById('yInput').value);
            }

            pos[0] = x;
            pos[1] = y;
        }

        function loadCords() {
            document.getElementById('xInput').value = pos[0];
            document.getElementById('yInput').value = pos[1];
        }

        function applyForce() {
            let fx = 0;
            let fy = 0;
            if(document.getElementById('forceXinput').value !== '') {
                fx = Number(document.getElementById('forceXinput').value);
            }

            if(document.getElementById('forceYinput').value !== '') {
                fy = Number(document.getElementById('forceYinput').value);
            }

            FORCE(fx,fy);
            updateDisplay();
        }

        function applyMode() {
            mode = document.getElementById('modeSelector').value;
            buffer = Number(document.getElementById('bufferInput').value);
        }

        function applyVelocity() {
            let ix = 0;
            let iy = 0;
            if(document.getElementById('velocityXinput').value !== '') {
                ix = Number(document.getElementById('velocityXinput').value);
            }

            if(document.getElementById('velocityYinput').value !== '') {
                iy = Number(document.getElementById('velocityYinput').value);
            }

            vx = ix;
            vy = iy;
            updateDisplay();
        }

        function updateDisplay() {
            document.getElementById('velocityOutput').innerText = `Velocity:\nX: ${vx}\nY: ${vy}`;
            document.getElementById('accellerationOutput').innerText = `Accelleration:\nX: ${ax}\nY: ${ay}`;
        }

        function tick() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            vx += ax*dt;
            vy += ay*dt;
            pos[0] += vx*dt;
            pos[1] += vy*dt;
            if(pos[0] >= canvas.width) {
                pos[0] = canvas.width-pos[0];
            } else if(pos[0] < 0) {
                pos[0] = canvas.width+pos[0];
            }

            if(pos[1] >= canvas.height) {
                pos[1] = canvas.height-pos[1];
            } else if(pos[1] < 0) {
                pos[1] = canvas.height+pos[1];
            }

            let speed = Math.hypot(vx, vy);

            if (speed > limit) {
                vx = (vx / speed) * limit;
                vy = (vy / speed) * limit;
            }

            trail.push([pos[0],pos[1]]);
            if(trail.length > 4) {
                trail.shift();
            }

            draw();

            if(contin === true) {
                if(mode === 'animation') {
                    requestAnimationFrame(tick);
                } else if(mode === 'timeout') {
                    setTimeout(tick,buffer);
                }
            }
        }

        let inter = setInterval(() => {
            updateDisplay();
        },2000);

        function set() {
            pos = [0,cy];
            updateDisplay();
            tick();
        }

        function FORCE(fx,fy) {
            ax += fx/m;
            ay += fy/m;
        }

        function draw() {
            let color = 'black';
            ctx.beginPath();
                ctx.fillStyle = color;
                ctx.arc(pos[0],pos[1],5,0,Math.PI*2);
            ctx.fill();
            if(showTrail === true) {
                trail.forEach(t => {
                    ctx.beginPath();
                        ctx.fillStyle = 'red';
                        ctx.arc(t[0],t[1],2,0,Math.PI*2);
                    ctx.fill();
                });
            }
        }

        set();
    </script>
</body>
</html>
